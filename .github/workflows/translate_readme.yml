name: Translate README to English

on:
  push:
    branches: [main]
    paths: ['README.md']
  schedule:
    # 每天 00:30 UTC 运行（在 update_all 自动生成 README 之后兜底同步英文版）
    - cron: '30 0 * * *'
  workflow_dispatch:  # 支持手动触发

# 首次使用前，请在仓库添加一个 Actions secret：
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  DEEPSEEK_API_KEY
#   Value: 你的 DeepSeek API Key（https://platform.deepseek.com）
# 可选 secret：DEEPSEEK_BASE_URL（默认 https://api.deepseek.com）、
#             DEEPSEEK_MODEL（默认 deepseek-chat）
# 未配置 DEEPSEEK_API_KEY 时，脚本会输出提示并跳过（任务仍为成功状态）。

permissions:
  contents: write

# 与 update_all / convert_resume 共用同一 group，避免并发 git push 冲突
concurrency:
  group: resume-writers
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Translate README.md to README.en.md
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: python .github/scripts/translate_readme.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.en.md

          if git diff --staged --quiet; then
            echo "README.en.md is up to date - nothing to commit."
            exit 0
          fi

          git commit -m "Auto-translate README to English (README.en.md)

          Generated from README.md by .github/scripts/translate_readme.py
          using the DeepSeek API."

          for i in 1 2 3; do
            if git push; then
              echo "✓ Changes pushed successfully"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)…"
            git pull --rebase --autostash origin main
            sleep 3
          done
          echo "⚠ push failed after 3 attempts"
          exit 1
