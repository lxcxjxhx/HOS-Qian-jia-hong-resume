name: Update PR Records and README

on:
  schedule:
    # 每天 UTC 00:00 运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main
    # 修正：脚本实际在 .github/scripts/ 下，旧路径 'generate_readme.py' 永远匹配不到
    paths:
      - '.github/scripts/generate_readme.py'
      - '.github/scripts/update_pr_workflow.py'
      - '.github/workflows/update_all.yml'

permissions:
  contents: write

# 与 convert_resume / translate_readme 共用同一 group：三个 job 都会 git push，
# 并发跑必然出现 "remote contains work you do not have" 的推空。
concurrency:
  group: resume-writers
  cancel-in-progress: false

jobs:
  update-pr-records:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Update PR records
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python .github/scripts/update_pr_workflow.py

    - name: Generate updated README
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python .github/scripts/generate_readme.py

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Auto-update PR records and README

        Updated at: ${TIMESTAMP}

        - Updated PR records with latest merged PRs
        - Regenerated README with current statistics
        - Updated contribution counts and metrics"

        # 提交期间远端可能已被 translate_readme 推进，重试 rebase 两次
        for i in 1 2 3; do
          if git push; then
            echo "✓ Changes pushed successfully"
            exit 0
          fi
          echo "push rejected, rebasing (attempt $i)…"
          git pull --rebase --autostash origin main
          sleep 3
        done
        echo "⚠ push failed after 3 attempts"
        exit 1
